# PoA core compatibility watch (poa-compat-watch). See poa-compat.json.
name: poa-compat

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write   # only needed for dispatch-workflow

concurrency:
  group: poa-compat
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Recommended: a GitHub App token, so the update pull request starts CI.
      # Create an App with Contents + Pull requests (read/write), install it on this repo, then store
      # POA_COMPAT_APP_ID (variable) and POA_COMPAT_APP_PRIVATE_KEY (secret). Without them the job
      # falls back to GITHUB_TOKEN and uses dispatch-workflow to start CI.
      - id: app
        if: ${{ vars.POA_COMPAT_APP_ID != '' }}
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ vars.POA_COMPAT_APP_ID }}
          private-key: ${{ secrets.POA_COMPAT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: maximusmaximus/poa-compat-watch@ea911e959e1100a7e8990291ea32bdfb4d671666 # v1.1
        with:
          config: poa-compat.json
          github-token: ${{ steps.app.outputs.token || github.token }}
          auto-merge-when: never
          dispatch-workflow: ${{ steps.app.outputs.token == '' && 'ci.yml' || '' }}
